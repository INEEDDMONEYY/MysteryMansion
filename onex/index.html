    <script>
      // A tab left open across a new deployment can still hold this stale index.html,
      // whose entry script tag points at a build hash that no longer exists on the
      // server. That request 404s and our SPA catch-all rewrite returns index.html
      // (text/html) instead, which the browser rejects with a MIME-type error and
      // never runs any of our bundled JS. Catch that at the plain-HTML level (before
      // any bundle needs to load) and force a one-time hard reload to fetch the
      // current index.html + fresh asset hashes.
      (function () {
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT" && t.type === "module" && !sessionStorage.getItem("chunk_reload")) {
              sessionStorage.setItem("chunk_reload", "1");
              window.location.reload();
            }
          },
          true
        );
      })();
    </script>

  <body>

      <!-- Pre-render splash; React replaces it on mount. -->
      <div role="status" aria-label="Loading TopEscortNetwork" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;">
        <img src="/src/assets/icons/ten-loader.svg" alt="" width="384" style="width:min(384px,80vw);height:auto;" />
