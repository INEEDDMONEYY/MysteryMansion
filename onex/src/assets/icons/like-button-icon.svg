<svg id="like" xmlns="http://www.w3.org/2000/svg" viewBox="-40 -110 280 300" width="280" height="300" role="button" tabindex="0" aria-label="Like" aria-pressed="false" style="cursor:pointer;overflow:visible" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset=".5" stop-color="#ff2fa6"/><stop offset="1" stop-color="#a64ee0"/></linearGradient></defs>
<style>
#like .castle{transform-origin:100px 170px;transform-box:view-box}
#like .body{fill:none;stroke:#9a8aa8;stroke-width:5;stroke-linejoin:round;transition:fill .25s,stroke .25s}
#like .body rect{}
#like .door,#like .win{fill:#9a8aa8;transition:fill .25s}
#like .flag{fill:#9a8aa8;transition:fill .25s}
#like.liked .body{fill:url(#cg);stroke:#7b1fa2}
#like.liked .door,#like.liked .win{fill:#0a0512}
#like.liked .flag{fill:#ffd166}
#like.liked .castle{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
#like .rk,#like .sp{opacity:0}
#like .sp{stroke-width:3;stroke-linecap:round}
#like.liked .rk{animation:rk .45s ease-out var(--d) both}
#like.liked .sp{animation:sp .8s ease-out var(--d) both}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.88,1.12)}60%{transform:scale(1.08,.94)}100%{transform:scale(1)}}
@keyframes rk{0%{opacity:1;transform:translate(0,0)}90%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes sp{0%{opacity:1;transform:translateX(0) scaleX(.3)}70%{opacity:1}100%{opacity:0;transform:translateX(18px) scaleX(1)}}
@media (prefers-reduced-motion:reduce){#like *{animation-duration:.01s!important}}
</style>
