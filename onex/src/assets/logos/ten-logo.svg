<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="20 44 624 236" width="624" height="236" role="img" aria-label="TEN – TopEscortNetwork" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>TEN</title>
  <defs>
    <linearGradient id="pink" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="256">
      <stop offset="0" stop-color="#ff5c80"/>
      <stop offset=".5" stop-color="#ff3d98"/>
      <stop offset="1" stop-color="#f02fd0"/>
    </linearGradient>
    <g id="L">
      <!-- T -->
      <path d="M48 72 Q140 62 232 72 L228 124 L206 108 Q198 102 162 102 L158 218 Q162 240 186 252 L94 252 Q118 240 122 218 L118 102 Q82 102 74 108 L52 124 Z"/>
      <!-- E -->
      <path d="M262 76 L410 70 L406 126 Q392 100 358 98 L330 98 L330 146 L368 146 L392 164 L368 182 L330 182 L330 226 L366 226 Q398 224 414 198 L418 252 L262 254 Q296 240 300 226 L300 108 Q296 90 262 76 Z"/>
      <!-- N -->
      <path transform="translate(10 0)" d="M432 76 L514 70 L562 162 L562 114 Q558 92 528 78 L606 72 Q592 92 592 116 L592 232 L580 254 L546 254 L500 164 L500 214 Q500 238 520 252 L436 254 Q462 240 462 214 L462 112 Q458 90 432 76 Z"/>
    </g>
    <clipPath id="clipL"><use xlink:href="#L" href="#L"/></clipPath>
  </defs>

  <!-- sticker outline -->
  <use xlink:href="#L" href="#L" fill="#05020a" stroke="#05020a" stroke-width="24" stroke-linejoin="round"/>
  <!-- letter body -->
  <use xlink:href="#L" href="#L" fill="url(#pink)"/>
  <g clip-path="url(#clipL)">
    <!-- inner purple bevel (bottom/right) -->
    <use xlink:href="#L" href="#L" fill="none" stroke="#8a2fc4" stroke-width="12" stroke-linejoin="round" transform="translate(-5 -6)"/>
    <!-- inner highlight (top/left) -->
    <use xlink:href="#L" href="#L" fill="none" stroke="#ffc6e0" stroke-width="6" stroke-linejoin="round" transform="translate(4 5)" opacity=".9"/>
    <!-- top gloss -->
    <rect x="30" y="60" width="620" height="82" fill="#fff" opacity=".16"/>
  </g>
  <!-- edge line -->
  <use xlink:href="#L" href="#L" fill="none" stroke="#a02bb8" stroke-width="3" stroke-linejoin="round"/>
  <!-- sparkles -->
  <g fill="#fff">
    <path d="M86 92 L89 100 L97 103 L89 106 L86 114 L83 106 L75 103 L83 100 Z"/>
    <path d="M560 96 L562 102 L568 104 L562 106 L560 112 L558 106 L552 104 L558 102 Z" opacity=".9"/>
  </g>
</svg>
